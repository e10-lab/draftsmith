[package]
name = "draftsmith-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "DraftSmith 데스크톱 앱 (Tauri 웹 화면) — 도면 처리는 draftsmith-core 를 그대로 쓴다"

[dependencies]
draftsmith-core = { path = "../draftsmith-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
# 바이너리 IPC 가 숫자 배열로 오는 환경에서 표시 데이터를 base64 글로 (§70)
base64 = "0.22"
tauri = { version = "2.12", features = [] }
# 공동작업 서버에 붙기 (§90) — MIT OR Apache-2.0
tungstenite = "0.26"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
