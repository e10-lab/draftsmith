[package]
name = "draftsmith-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "DraftSmith 코어 — 도면 모델, DXF·DWG 가져오기, 화면용 표시 데이터"

[dependencies]
# DXF·DWG 읽기·쓰기 (MPL-2.0, 순수 Rust) — 구현 노트 §3
acadrust = "0.6.8"
thiserror = "2"
# 채움(해치·솔리드) 삼각형 분할 — MIT OR Apache-2.0
earcut = "0.4"
# 스냅 점 공간 색인 (R*-tree) — MIT OR Apache-2.0
rstar = "0.14"
# PDF 출력 (글꼴 부분 삽입) — MIT OR Apache-2.0
krilla = "0.8"
# 글자 폭 (PDF 문자 맞춤) — MIT OR Apache-2.0
ttf-parser = "0.25"
# CTB 출력 스타일 압축 풀기 — MIT OR Apache-2.0
flate2 = "1"
# 도면 저장(.dsmith) — MIT OR Apache-2.0 / MIT
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
